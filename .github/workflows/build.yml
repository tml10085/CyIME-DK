name: Build and Test APK

on:
  push:
    branches:
      - main
      - dev*
  pull_request:
  workflow_dispatch:
    inputs:
      side_by_side:
        description: 'Build side-by-side CyIME DK package (com.cyletix.cyime.dk)'
        type: boolean
        default: true

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
        
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
        
      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
        
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          
      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon
        
      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-
            
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 固定签名：仓库配了 DK_SIGNING_* Secrets 时写出 app/keystore.properties，debug 包每次用同一把密钥签，
      # 测试包可以直接覆盖安装；没配时照旧用构建机器临时生成的调试签名。
      - name: Configure fixed signing
        env:
          DK_SIGNING_KEY_BASE64: ${{ secrets.DK_SIGNING_KEY_BASE64 }}
          DK_SIGNING_PASSWORD: ${{ secrets.DK_SIGNING_PASSWORD }}
          DK_SIGNING_ALIAS: ${{ secrets.DK_SIGNING_ALIAS }}
        run: |
          if [ -n "$DK_SIGNING_KEY_BASE64" ] && [ -n "$DK_SIGNING_PASSWORD" ] && [ -n "$DK_SIGNING_ALIAS" ]; then
            {
              echo "keyBase64=$DK_SIGNING_KEY_BASE64"
              echo "storePassword=$DK_SIGNING_PASSWORD"
              echo "keyPassword=$DK_SIGNING_PASSWORD"
              echo "keyAlias=$DK_SIGNING_ALIAS"
            } > app/keystore.properties
            echo "Fixed signing configured."
          else
            echo "No DK_SIGNING_* secrets; using the runner's temporary debug key."
          fi

      - name: Run Unit Tests
        run: |
          if [ "${{ inputs.side_by_side }}" = "true" ] || [ "${{ github.event_name != 'workflow_dispatch' && github.repository == 'tml10085/CyIME-DK' }}" = "true" ]; then
            ./gradlew :plugin-core:testDebugUnitTest --no-daemon
            ./gradlew :app:testDebugUnitTest \
              -x prepareJapaneseDictionaries -x prepareAzooKeyLibraries -x prepareOfflineTranslateLibraries \
              --tests "com.kingzcheung.xime.settings.LetterLanguagesTest" \
              --tests "com.kingzcheung.xime.association.WordLexiconTest" \
              --tests "com.kingzcheung.xime.association.WordBigramPredictorTest" \
              --tests "com.kingzcheung.xime.service.AssociationSelectionTest" \
              --tests "com.kingzcheung.xime.service.EnglishLiteralInputTest" \
              --tests "com.kingzcheung.xime.glide.GlidePairCorrectionTest" \
              --tests "com.kingzcheung.xime.ui.settings.LanguageRowsTest" \
              --no-daemon
          else
            ./gradlew :app:testDebugUnitTest :plugin-core:testDebugUnitTest --no-daemon
          fi
        
      - name: Generate Test Report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '**/build/test-results/testDebugUnitTest/*.xml'
          fail_on_failure: true
          
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 7
          
      - name: Build Debug APKs
        run: |
          if [ "${{ inputs.side_by_side }}" = "true" ] || [ "${{ github.event_name != 'workflow_dispatch' && github.repository == 'tml10085/CyIME-DK' }}" = "true" ]; then
            ./gradlew assembleDebug --init-script scripts/phone-release-abi.gradle -PsideBySide=true \
              -x prepareJapaneseDictionaries -x prepareAzooKeyLibraries -x prepareOfflineTranslateLibraries --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Build Plugin XIPKs
        run: bash scripts/build-plugins.sh

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            build/plugin-release/*.xipk
          retention-days: 7