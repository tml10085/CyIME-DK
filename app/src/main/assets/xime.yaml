  # 注意：本键盘不支持 button_layout（按键布局模式），固定 standard 键面布局；
  # 此处配置 button_layout: compact 不生效（compact 仅 26 键 qwerty/qwerty_en 支持）。
  # schemas 声明使用九键布局的方案，未声明的方案一律全键盘；
  # 第三方九键方案在 xime.custom.yaml 的 t9.schemas 追加即可，无需改代码。
  t9:
    # t9_flypy：方案商店的「小鹤双拼九键」，装了才生效。
    schemas: [t9_pinyin, t9, wanxiang_t9, t9_flypy]
    # ── 左侧快捷符号栏（空闲态显示；列表长度不限，超过 4 个时可上下滑动，右缘有滚动条）──
    # 默认是最常用的中文标点，按使用频率排，括号只留一对；列尾的「编辑」打开设置里的「九键侧栏」。
    # 用户在 xime.custom.yaml 的同路径覆盖整个列表，未配置时使用内置默认值
    side_symbols:
      - "，"
      - "。"
      - "？"
      - "！"
      - "…"
      - "～"
      - "、"
      - "："
      - "“"
      - "”"
      - "；"
      - "（"
      - "）"
    # ── 数字键手势（可自定义：在 xime.custom.yaml 的 keyboard.t9.keys 同路径覆盖）──
    # 键 id 为数字字符串 "1"~"9"；tap/长按（选字母）为九键核心交互，不在配置范围。
    # 内置默认：上滑直接输入键面数字（无需切数字键盘）；下滑内置不绑定动作，
    # 可按键级自行配置（如 swipe_down: { label: "复制", action: "copy" }，
    # 或 switch_route: clipboard 打开剪贴板面板）。
    # 动作可选值见 GestureAction：commit/select_all/copy/cut/paste/line_start/line_end/
    # undo/repeat/command/switch_route（value: emoji|symbol|clipboard 打开对应面板）等；
    # display 控制提示显示位置：key（仅键面提示，无滑动气泡）/ bubble（仅滑动气泡，
    # 不印键面）/ both（键面+气泡）。内置默认全部显式配 display: "both"（显示滑动
    # 气泡），松手提交。手势功能与提示相互独立，
    # 提示开关/display 关闭提示后手势仍生效。
    keys:
      "1": { swipe_up: { value: "1", display: "both" } }
      "2": { swipe_up: { value: "2", display: "both" } }
      "3": { swipe_up: { value: "3", display: "both" } }
      "4": { swipe_up: { value: "4", display: "both" } }
      "5": { swipe_up: { value: "5", display: "both" } }
      "6": { swipe_up: { value: "6", display: "both" } }
      "7": { swipe_up: { value: "7", display: "both" } }
      "8": { swipe_up: { value: "8", display: "both" } }
      "9": { swipe_up: { value: "9", display: "both" } }

  # 笔画键盘配置
  # 注意：本键盘不支持 button_layout（按键布局模式），固定 standard 键面布局；
  # 此处配置 button_layout: compact 不生效（compact 仅 26 键 qwerty/qwerty_en 支持）。
  # schemas 声明使用笔画布局的方案，未声明的方案一律全键盘；
  # 第三方笔画方案在 xime.custom.yaml 的 stroke.schemas 追加即可。
  stroke:
    schemas: [stroke]
    # ── 左侧快捷符号列（常显；列表长度不限，超过 3 个时滚动显示）──
    # 用户在 xime.custom.yaml 的同路径覆盖整个列表，未配置时使用内置默认值
    side_symbols:
      - "。"
      - "？"
      - "！"
      - "~"
    # ── 笔画键手势（可自定义：在 xime.custom.yaml 的 keyboard.stroke.keys 同路径覆盖）──
    # 键 id 为键面标签；内置默认：上滑输入对应数字（与历史行为一致，此前版本该手势
    # 因缺少滑动提示文本实际不触发，现修复生效），下滑可按需绑定编辑动作。
    # display：key（仅键面提示，无滑动气泡）/ bubble（仅滑动气泡）/ both（键面+气泡）。
    # 内置上滑全部显式配 display: "key"（不显示滑动气泡，数字提示由键面右上角角标
    # 承担）；想要拖动气泡自行改为 display: "both"。手势功能与提示相互独立。
    keys:
      "一": { swipe_up: { value: "1", display: "key" } }
      "丨": { swipe_up: { value: "2", display: "key" } }
      "丿": { swipe_up: { value: "3", display: "key" } }
      "丶": { swipe_up: { value: "4", display: "key" } }
      "乛": { swipe_up: { value: "5", display: "key" } }
      "*": { swipe_up: { value: "6", display: "key" } }
      "分词": { swipe_up: { value: "7", display: "key" } }
      "，": { swipe_up: { value: "8", display: "key" } }
      "。": { swipe_up: { value: "9", display: "key" } }

  # 手写键盘配置
  # schemas 声明使用手写布局的方案：手写不经过 rime 引擎（由 HandwritingEngine
  # 识别，模型在应用内管理），切换时不调 rime switchSchema、不走个人词典。
  # 未声明的方案一律全键盘；第三方手写方案在 xime.custom.yaml 的
  # handwriting.schemas 追加即可，无需改代码。
  handwriting:
    schemas: [handwriting]
