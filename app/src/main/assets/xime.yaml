      e: { tap: { label: "水", value: "e" }, long_press: { display: "bubble", values: ["e", "E"] } }
      r: { tap: { label: "口", value: "r" }, long_press: { display: "bubble", values: ["r", "R"] } }
      t: { tap: { label: "廿", value: "t" }, long_press: { display: "bubble", values: ["t", "T"] } }
      y: { tap: { label: "卜", value: "y" }, long_press: { display: "bubble", values: ["y", "Y"] } }
      u: { tap: { label: "山", value: "u" }, long_press: { display: "bubble", values: ["u", "U"] } }
      i: { tap: { label: "戈", value: "i" }, long_press: { display: "bubble", values: ["i", "I"] } }
      o: { tap: { label: "人", value: "o" }, long_press: { display: "bubble", values: ["o", "O"] } }
      p: { tap: { label: "心", value: "p" }, long_press: { display: "bubble", values: ["p", "P"] } }
      a: { tap: { label: "日", value: "a" }, long_press: { display: "bubble", values: ["a", "A"] } }
      s: { tap: { label: "尸", value: "s" }, long_press: { display: "bubble", values: ["s", "S"] } }
      d: { tap: { label: "木", value: "d" }, long_press: { display: "bubble", values: ["d", "D"] } }
      f: { tap: { label: "火", value: "f" }, long_press: { display: "bubble", values: ["f", "F"] } }
