      jk: { tap: { label: "jk", value: "j" }, long_press: { display: "bubble", values: ["j", "k", "J", "K"] } }
      l:  { tap: { label: "l", value: "l" }, long_press: { display: "bubble", values: ["l", "L"] } }
      z:  { tap: { label: "z", value: "z" }, long_press: { display: "bubble", values: ["z", "Z"] } }
      xc: { tap: { label: "xc", value: "x" }, long_press: { display: "bubble", values: ["x", "c", "X", "C"] } }
      v:  { tap: { label: "v", value: "v" }, long_press: { display: "bubble", values: ["v", "V"] } }
      bn: { tap: { label: "bn", value: "b" }, long_press: { display: "bubble", values: ["b", "n", "B", "N"] } }
      m:  { tap: { label: "m", value: "m" }, long_press: { display: "bubble", values: ["m", "M"] } }
      "'": { tap: { label: "，", value: "," }, swipe_up: { label: "。", value: "." } , long_press: { display: "bubble", values: [ ",","."] }}
      earth: { tap: { label: "@language", action: "toggle_ascii" }, long_press: { display: "bubble", values: [ { label: "选择输入法", action: "command", value: "show_ime_picker" } ] } }

  # 拼音 18 键：we/rt/io、sd/fg/jk、xc/bn（对应方案 pinyin_18jian）
  qwerty_18:
    schemas: [pinyin_18jian]
    button_layout: standard
    layout:
      rows:
        - [q, [w, e], [r, t], y, u, [i, o], p]
        - [a, [s, d], [f, g], h, [j, k], l]
        - [z, [x, c], v, [b, n], m]
    keys:
      # 上下角标按合并键共用规则（MergedKeySymbols）：前 10 个键上 1-0、下 + @ # / % - _ * （ ），其余键上 、：！？；…、下 …… ～ 《 》 …；
      # 这里给某个键写 swipe_up / swipe_down 会顶替预设。
      q:  { tap: { label: "q", value: "q" }, long_press: { display: "bubble", values: ["q", "Q"] } }
      we: { tap: { label: "we", value: "w" }, long_press: { display: "bubble", values: ["w", "e", "W", "E"] } }
      rt: { tap: { label: "rt", value: "r" }, long_press: { display: "bubble", values: ["r", "t", "R", "T"] } }
      y:  { tap: { label: "y", value: "y" }, long_press: { display: "bubble", values: ["y", "Y"] } }
      u:  { tap: { label: "u", value: "u" }, long_press: { display: "bubble", values: ["u", "U"] } }
      io: { tap: { label: "io", value: "i" }, long_press: { display: "bubble", values: ["i", "o", "I", "O"] } }
      p:  { tap: { label: "p", value: "p" }, long_press: { display: "bubble", values: ["p", "P"] } }
      a:  { tap: { label: "a", value: "a" }, long_press: { display: "bubble", values: ["a", "A"] } }
      sd: { tap: { label: "sd", value: "s" }, long_press: { display: "bubble", values: ["s", "d", "S", "D"] } }
      fg: { tap: { label: "fg", value: "f" }, long_press: { display: "bubble", values: ["f", "g", "F", "G"] } }
      h:  { tap: { label: "h", value: "h" }, long_press: { display: "bubble", values: ["h", "H"] } }
      jk: { tap: { label: "jk", value: "j" }, long_press: { display: "bubble", values: ["j", "k", "J", "K"] } }
      l:  { tap: { label: "l", value: "l" }, long_press: { display: "bubble", values: ["l", "L"] } }
      z:  { tap: { label: "z", value: "z" }, long_press: { display: "bubble", values: ["z", "Z"] } }
      xc: { tap: { label: "xc", value: "x" }, long_press: { display: "bubble", values: ["x", "c", "X", "C"] } }
